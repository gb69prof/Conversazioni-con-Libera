name: Verifica sola lettura portale per Libera autonoma

on:
  push:
    paths:
      - '.github/workflows/libera-site-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Apri canale SSH noto per sola lettura
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "157.180.67.132"
          test "$DEPLOY_USER" = "gbdeploy"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/gbprof-deploy"
          chmod 600 "$HOME/.ssh/gbprof-deploy"
          ssh-keygen -y -f "$HOME/.ssh/gbprof-deploy" > /dev/null
          printf '%s\n' '157.180.67.132 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDr7fqbQyfX4YPqM8zf07wgYyeBnNVNASYXQi+VOoxtE' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/gbprof-deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'sh -s' <<'REMOTE'
          set -eu
          echo '=== STATO ROOT PUBBLICA ==='
          ls -ld /opt/gbprof/www /opt/gbprof/www/index.html /opt/gbprof/projects
          echo '=== ACCORDI DI ACCESSO ==='
          for path in /opt/gbprof/www /opt/gbprof/www/index.html /opt/gbprof/projects /opt/gbprof/projects/Conversazioni-con-Libera; do
            if test -w "$path"; then echo "WRITE $path"; else echo "READONLY $path"; fi
          done
          echo '=== VOCI ARCHIVIO NELLA HOME ==='
          grep -inE 'archivio|conversazioni|libera' /opt/gbprof/www/index.html | head -c 10000 || :
          echo
          echo '=== PERCORSI PUBBLICATI ==='
          ls -ld /opt/gbprof/www/Conversazioni-con-Libera /opt/gbprof/www/Libera-autonoma 2>&1 || :
          REMOTE
      - name: Pulisci chiave
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/gbprof-deploy"
